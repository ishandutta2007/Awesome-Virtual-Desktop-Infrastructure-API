<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#07182c"/>
      <stop offset="100%" stop-color="#0d0824"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38ef7d"/>
      <stop offset="50%" stop-color="#11998e"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56, 189, 248, 0.07)" stroke-width="1"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }

    @keyframes lineDash {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-12px) translateX(8px); }
    }

    @keyframes ringRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .bg-grid { fill: url(#grid); }
    .pulse-orb-1 { animation: pulseGlow 6s ease-in-out infinite; transform-origin: 200px 180px; }
    .pulse-orb-2 { animation: pulseGlow 8s ease-in-out infinite 2s; transform-origin: 1000px 140px; }
    .floating-particle { animation: floatParticle 4s ease-in-out infinite; }
    .rotating-ring { animation: ringRotate 25s linear infinite; transform-origin: 1050px 180px; }
    .data-stream { stroke-dasharray: 8 12; animation: lineDash 3s linear infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" rx="16" class="bg-grid"/>

  <!-- Glowing Orbs in Background -->
  <circle cx="200" cy="180" r="180" fill="#00f2fe" opacity="0.15" filter="url(#softGlow)" class="pulse-orb-1"/>
  <circle cx="1000" cy="140" r="160" fill="#38ef7d" opacity="0.12" filter="url(#softGlow)" class="pulse-orb-2"/>

  <!-- Network Topology Lines (Background Graphic) -->
  <g stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" fill="none">
    <path d="M 100 280 C 250 200, 350 320, 500 240 S 750 160, 950 260" class="data-stream"/>
    <path d="M 150 80 C 350 160, 550 60, 800 120 S 1050 40, 1150 140" stroke="rgba(56, 239, 125, 0.2)"/>
  </g>

  <!-- Node Circles in Background -->
  <g class="floating-particle">
    <circle cx="150" cy="80" r="4" fill="#00f2fe" filter="url(#glow)"/>
    <circle cx="500" cy="240" r="5" fill="#38ef7d" filter="url(#glow)"/>
    <circle cx="800" cy="120" r="4" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="950" cy="260" r="6" fill="#00f2fe" filter="url(#glow)"/>
  </g>

  <!-- Decorative Rotating Tech Accent on Right -->
  <g class="rotating-ring" stroke="rgba(56, 189, 248, 0.15)" stroke-width="2" fill="none">
    <circle cx="1050" cy="180" r="90" stroke-dasharray="20 10 5 10"/>
    <circle cx="1050" cy="180" r="65" stroke-dasharray="40 15"/>
  </g>

  <!-- Top Decorative Border Highlight -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#cyanPurple)"/>

  <!-- Foreground Content Block -->
  <g text-anchor="middle" transform="translate(600, 0)">
    
    <!-- Top Pill Badge -->
    <g transform="translate(0, 52)">
      <rect x="-140" y="-16" width="280" height="32" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1.5">⚡ CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="34" font-weight="900" fill="url(#titleGrad)" letter-spacing="0.5" filter="url(#glow)">
      Awesome Virtual Desktop Infrastructure API
    </text>

    <!-- Subtitle -->
    <text x="0" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" fill="#94a3b8" letter-spacing="0.3">
      Desktop Provisioning • Session Brokering • DaaS REST APIs • Cloud Hypervisor Automation
    </text>

    <!-- Technology Pills Row (Foreground) -->
    <g transform="translate(0, 230)">
      <!-- Pill 1: AWS WorkSpaces -->
      <g transform="translate(-360, 0)">
        <rect x="-70" y="-16" width="140" height="32" rx="8" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(255, 153, 0, 0.4)" stroke-width="1"/>
        <text x="0" y="5" font-family="sans-serif" font-size="12" font-weight="600" fill="#ff9900">AWS WorkSpaces</text>
      </g>
      
      <!-- Pill 2: Windows 365 -->
      <g transform="translate(-200, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="8" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(0, 164, 239, 0.4)" stroke-width="1"/>
        <text x="0" y="5" font-family="sans-serif" font-size="12" font-weight="600" fill="#00a4ef">Windows 365</text>
      </g>

      <!-- Pill 3: Citrix DaaS -->
      <g transform="translate(-50, 0)">
        <rect x="-60" y="-16" width="120" height="32" rx="8" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(166, 124, 0, 0.5)" stroke-width="1"/>
        <text x="0" y="5" font-family="sans-serif" font-size="12" font-weight="600" fill="#eab308">Citrix DaaS</text>
      </g>

      <!-- Pill 4: Guacamole -->
      <g transform="translate(90, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="8" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(56, 239, 125, 0.4)" stroke-width="1"/>
        <text x="0" y="5" font-family="sans-serif" font-size="12" font-weight="600" fill="#38ef7d">Guacamole API</text>
      </g>

      <!-- Pill 5: Kasm Workspaces -->
      <g transform="translate(235, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="8" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1"/>
        <text x="0" y="5" font-family="sans-serif" font-size="12" font-weight="600" fill="#c084fc">Kasm Workspaces</text>
      </g>

      <!-- Pill 6: Proxmox & KVM -->
      <g transform="translate(380, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="8" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(239, 68, 68, 0.4)" stroke-width="1"/>
        <text x="0" y="5" font-family="sans-serif" font-size="12" font-weight="600" fill="#f87171">Proxmox / KVM</text>
      </g>
    </g>

    <!-- Bottom Stat Line -->
    <text x="0" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#64748b" letter-spacing="1">
      25+ APIS &amp; OPEN-SOURCE FRAMEWORKS • REGULARLY UPDATED
    </text>

  </g>
</svg>
